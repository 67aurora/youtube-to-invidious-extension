<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 180px; padding: 12px; margin: 0; text-align: center; background: #181818; color: white; }
    h3 { margin: 0 0 8px 0; font-size: 13px; color: #aaa; }
    .row { margin-bottom: 16px; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #00b359; }
    input:checked + .slider:before { transform: translateX(24px); }
    select { width: 100%; padding: 6px; border-radius: 4px; background: #333; color: white; border: 1px solid #555; margin-top: 8px; font-size: 12px; }
  </style>
  <script src="popup.js" defer></script>
</head>
<body>
  <div class="row">
    <h3>Redirect YouTube</h3>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
    <select id="instanceSelect">
      <option value="inv.nadeko.net">inv.nadeko.net</option>
      <option value="invidious.nerdvpn.de">invidious.nerdvpn.de</option>
      <option value="yt.chocolatemoo53.com">yt.chocolatemoo53.com</option>
      <option value="invidious.tiekoetter.com">invidious.tiekoetter.com</option>
      <option value="invidious.f5.si">invidious.f5.si</option>
      <option value="inv.zoomerville.com">inv.zoomerville.com</option>
    </select>
  </div>
  <div class="row" style="margin-bottom: 0;">
    <h3>Auto-Reload Error</h3>
    <label class="switch">
      <input type="checkbox" id="reloadToggle">
      <span class="slider"></span>
    </label>
  </div>
</body>
</html>
